[project]
name = "comfy-h3-preview-override"
description = "H3 Preview Override: KJNodes' Preview Override ported to MiniMax H3 — whole-shot live sampling preview with latent2rgb/taeh3/full-VAE decode, scrubbable per-step frames, collapsible sigma/delta and step-time graphs, and true-speed playback."
version = "0.5.1"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Nothing beyond what ComfyUI itself already installs. PyAV is optional: present, and
# built with NVENC, it is used for MP4 previews; otherwise animated WebP is used instead.
dependencies = []
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
]

[project.urls]
Repository = "https://github.com/StylusEcho/Comfy-H3-Preview-Override"
"Bug Tracker" = "https://github.com/StylusEcho/Comfy-H3-Preview-Override/issues"

[tool.comfy]
# Must match the publisher you create at https://registry.comfy.org
PublisherId = "stylusecho"
DisplayName = "Comfy-H3-Preview-Override"
Icon = ""
# comfy_api.latest, the packed AV latent and H3 support all landed in ComfyUI 0.30.0;
# the taeh3 decode path additionally needs a core build that ships comfy.taesd.taehv
# (present in the same recent releases that added TAEHV/LTX2 video previews).
requires-comfyui = ">=0.30.0"
